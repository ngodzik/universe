[package]
name    = "universe-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The universe window: draws the interface's state on the GPU with Bevy and egui."

[dependencies]
universe-core.workspace  = true
universe-tools.workspace = true
universe-agent.workspace = true
universe-ui.workspace    = true
universe-codemap.workspace = true
universe-preview.workspace = true
thiserror.workspace       = true
bevy.workspace            = true
bevy_egui.workspace       = true
bevy_cef.workspace        = true
egui_plot.workspace       = true
serde_json.workspace      = true
image.workspace           = true
tokio = { workspace = true, features = ["rt", "time"] }

# Unbundled, as a build run from its folder is, CEF is found where it was
# installed for development.
[target.'cfg(target_os = "macos")'.dependencies]
bevy_cef = { workspace = true, features = ["debug"] }

[dev-dependencies]
tempfile.workspace = true
