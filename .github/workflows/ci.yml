name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push replaces the run it supersedes instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Nothing here needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody reads is a warning that does not exist.
  RUSTFLAGS: -D warnings
  # Where the Chrome the App view holds (CEF) is downloaded once, and kept
  # from a run to the next.
  CEF_PATH: ${{ github.workspace }}/../cef

jobs:
  lint:
    name: Format, lints and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The window links Wayland's client library, found with pkg-config, and
      # ALSA's, which Bevy's remote tools bring with CEF's integration; CEF's
      # wrapper is built with Ninja.
      - name: Wayland and ALSA headers, and Ninja
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libasound2-dev ninja-build
      - name: CEF, kept between runs
        uses: actions/cache@v6
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-154.5.0-${{ runner.os }}-${{ runner.arch }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features

      # CLAUDE.md requires a doc-comment on every public item. This is what
      # checks that the promise is kept, and it catches broken intra-doc links
      # at the same time.
      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux, where universe is developed and used, and macOS, where it is
        # meant to run too. Not Windows: nothing has been tried there.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The window links Wayland's client library, found with pkg-config, and
      # ALSA's, which Bevy's remote tools bring with CEF's integration; CEF's
      # wrapper is built with Ninja.
      - name: Wayland and ALSA headers, and Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libasound2-dev ninja-build
      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: CEF, kept between runs
        uses: actions/cache@v6
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-154.5.0-${{ runner.os }}-${{ runner.arch }}
      # Without them the rendering test returns early, and a regression such
      # as macOS' `/var` symlink would not show. Linux images ship both.
      - name: Kustomize and Helm
        if: runner.os == 'macOS'
        run: brew install kustomize helm
      - name: Kustomize and Helm are there
        run: kustomize version && helm version
      - name: Tests
        run: cargo test --workspace --all-features

  msrv:
    name: Oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The ref is the toolchain: this installs Rust 1.99. Keep it in step with
      # rust-version in Cargo.toml, which is the value that binds. Dependabot
      # is told to leave it alone in dependabot.yml.
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      # The window links Wayland's client library, found with pkg-config, and
      # ALSA's, which Bevy's remote tools bring with CEF's integration; CEF's
      # wrapper is built with Ninja.
      - name: Wayland and ALSA headers, and Ninja
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libasound2-dev ninja-build
      - name: CEF, kept between runs
        uses: actions/cache@v6
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-154.5.0-${{ runner.os }}-${{ runner.arch }}

      # The ref above and rust-version state the same fact in two places, and two
      # places drift. This makes them disagree loudly instead of leaving the job
      # quietly testing a toolchain nobody promised.
      - name: The toolchain is the one the manifest promises
        run: |
          declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1 | cut -d. -f1,2)
          installed=$(rustc --version | cut -d' ' -f2 | cut -d. -f1,2)
          echo "Cargo.toml says $declared, this runner has $installed"
          if [ -z "$declared" ]; then
            echo "::error::no rust-version found in Cargo.toml"
            exit 1
          fi
          if [ "$declared" != "$installed" ]; then
            echo "::error::Cargo.toml promises Rust $declared but CI installed $installed"
            exit 1
          fi

      - name: Build
        run: cargo check --workspace --all-targets --all-features
